name: Dependabot auto-rebase

# When main advances, Dependabot PRs fall "behind" (because branch protection
# requires branches to be up to date before merging). Dependabot's built-in
# rebase-strategy: auto only kicks in on conflicts or base dependency changes,
# not on a plain "behind" state. This workflow asks Dependabot to rebase those
# behind PRs so they stay mergeable without a manual `@dependabot rebase` comment.
# Rebasing keeps Dependabot's clean single-commit history.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Dependabot to rebase behind PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # List open Dependabot PRs that are behind the base branch.
          prs=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --author "app/dependabot" \
            --json number,mergeStateStatus \
            --jq '.[] | select(.mergeStateStatus == "BEHIND") | .number')

          if [ -z "$prs" ]; then
            echo "No behind Dependabot PRs to rebase."
            exit 0
          fi

          for pr in $prs; do
            echo "Requesting rebase for PR #$pr"
            gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase"
          done
