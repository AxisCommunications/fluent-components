name: Deploy Storybook to gh-pages/storybook

on:
  workflow_dispatch:
  push:
    branches:
      - dev-design-storybook

jobs:
  storybook-gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter examples storybook:build

      - name: Stage Pages artifact
        run: |
          mkdir -p publish/docs/storybook
          cp -r examples/storybook-static/. publish/docs/storybook/
          # GitHub Pages serves this repo from the gh-pages branch /docs folder
          # via a legacy Jekyll build, which ignores files starting with "_"
          # (e.g. Storybook's __resetStyles.esm-*.js). A .nojekyll at the docs
          # root disables Jekyll so those module chunks are served.
          touch publish/docs/.nojekyll

      - name: Deploy Storybook to gh-pages/docs/storybook
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./publish
          keep_files: true