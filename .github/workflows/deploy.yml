name: Deploy examples to gh-pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile

      - name: Build example project
        run: pnpm --filter examples build

      - name: Stage Pages artifact
        run: |
          mkdir -p publish/docs
          cp -r examples/dist/. publish/
          cp -r examples/dist/. publish/docs/
          touch publish/.nojekyll
          touch publish/docs/.nojekyll

      - name: Deploy example page to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./publish
          keep_files: true
